name: Farm DevOps CI

on:
push:
branches: [main]

jobs:
  build:
  runs-on:ubuntu-latest

  steps:
  -name: Checkout Code
  uses: actions/checkout@v3

  -name: Set Node.js
   uses: actions/setup-node@v3
   with:
   node-version: '18'

   -name:Install Dependencies
   run: npm Install

   -name: Run Server Test
   run: node server.js