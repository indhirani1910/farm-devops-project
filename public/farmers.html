<section class="content">
  <h2>Registered Farmers</h2>

  <table>
    <tr>
      <th>ID</th>

      <th>Location</th>
      <th>Crop Type</th>
    </tr>
    <tr>

    <tr>
      <td>F002</td>

    <tr>
      <td>F003</td>

    </tr>
  </table>

</section>
<script>
window.onload = function() {
    const users = JSON.parse(localStorage.getItem("users") || "[]");
    const table = document.getElementById("farmers-table");

    users.forEach((user, index) => {
        const row = table.insertRow();

        row.insertCell(0).innerText = index + 1;        // ID
        row.insertCell(1).innerText = user.fullname;    // Name
        row.insertCell(2).innerText = user.location || "";  // Location (optional)
        row.insertCell(3).innerText = user.cropType || "";  // Crop Type (optional)
        row.insertCell(4).innerText = user.email;       // Email
        row.insertCell(5).innerText = user.password;    // Password
    });
}
</script>
</body>
</html>
